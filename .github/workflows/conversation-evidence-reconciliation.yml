name: PCC conversation evidence reconciliation

on:
  push:
    branches:
      - worker/pcc-conversation-evidence-reconciliation
    paths:
      - .github/workflows/conversation-evidence-reconciliation.yml
      - build/Apply-ConversationEvidenceReconciliation.ps1

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/pcc-conversation-evidence-reconciliation
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply conversation evidence reconciliation
        shell: pwsh
        run: ./build/Apply-ConversationEvidenceReconciliation.ps1

      - name: Run full deterministic test solution
        shell: pwsh
        run: dotnet test PCCExecutive.sln -c Release

      - name: Commit proven hotfix and retire applicator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.Browser/PlaywrightChromeRuntimeHost.cs src/PCCExecutive.Browser/ChatGptBrowserAdapter.cs src/PCCExecutive.Browser/ChatGptConversationEvidenceMatcher.cs src/PCCExecutive.Browser/DispatchAndResilience.cs src/PCCExecutive.App/Presentation/IntegratedPresentationGateway.cs tests/PCCExecutive.Browser.Tests/ConversationIdentityEvidenceTests.cs
          git rm .github/workflows/conversation-evidence-reconciliation.yml build/Apply-ConversationEvidenceReconciliation.ps1
          git commit -m "fix(runtime): reconcile accepted conversations by durable message evidence"
          git push origin HEAD:worker/pcc-conversation-evidence-reconciliation
