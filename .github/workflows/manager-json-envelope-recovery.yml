name: PCC Manager JSON envelope recovery

on:
  push:
    branches:
      - worker/pcc-manager-json-envelope-recovery

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, 'fix(manager): tolerate ChatGPT response wrappers') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply parser boundary fix
        shell: pwsh
        run: ./build/Apply-ManagerJsonEnvelopeRecovery.ps1
      - name: Manager parser regression tests
        shell: pwsh
        run: dotnet test tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj -c Release
      - name: Full deterministic solution
        shell: pwsh
        run: dotnet test PCCExecutive.sln -c Release
      - name: Commit proven source fix and retire applicator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.Application/ManagerOrchestration.cs
          git rm build/Apply-ManagerJsonEnvelopeRecovery.ps1 .github/workflows/manager-json-envelope-recovery.yml
          git commit -m "fix(manager): tolerate ChatGPT response wrappers"
          git push origin HEAD:worker/pcc-manager-json-envelope-recovery
