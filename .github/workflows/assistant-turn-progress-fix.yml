name: PCC Assistant turn + progress fix

on:
  push:
    branches:
      - worker/pcc-autopilot-livelock-recovery
    paths:
      - build/Apply-AssistantTurnAndActivityTimerFix.ps1
      - .github/workflows/assistant-turn-progress-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply runtime/browser/UI fix
        shell: pwsh
        run: ./build/Apply-AssistantTurnAndActivityTimerFix.ps1
      - name: Browser regression tests
        shell: pwsh
        run: dotnet test tests/PCCExecutive.Browser.Tests/PCCExecutive.Browser.Tests.csproj -c Release --nologo
      - name: App regression tests
        shell: pwsh
        run: dotnet test tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj -c Release --nologo
      - name: Full deterministic solution
        shell: pwsh
        run: dotnet test PCCExecutive.sln -c Release --nologo
      - name: Commit proven fix and retire applicator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.Browser/ChatGptBrowserAdapter.cs src/PCCExecutive.App/MainWindow.xaml src/PCCExecutive.App/MainWindow.xaml.cs
          git rm build/Apply-AssistantTurnAndActivityTimerFix.ps1 .github/workflows/assistant-turn-progress-fix.yml
          git commit -m "fix(runtime): detect current ChatGPT turns and show step seconds"
          git push origin HEAD:worker/pcc-autopilot-livelock-recovery
