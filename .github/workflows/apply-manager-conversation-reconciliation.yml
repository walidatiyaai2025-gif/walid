name: Apply Manager conversation reconciliation patch

on:
  push:
    branches:
      - worker/pcc-github-evidence-recovery
    paths:
      - tools/apply_manager_conversation_reconciliation_patch.py

permissions:
  contents: write

concurrency:
  group: manager-conversation-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply deterministic patch
        shell: bash
        run: python tools/apply_manager_conversation_reconciliation_patch.py

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.App/Presentation/IntegratedPresentationGateway.cs tests/PCCExecutive.App.Tests/ProductionRecoveryWiringContractTests.cs
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "fix(runtime): reconcile Manager conversation identity without stalling"
          git push origin HEAD:worker/pcc-github-evidence-recovery
