name: PCC autopilot livelock recovery

on:
  push:
    branches:
      - worker/pcc-autopilot-livelock-recovery

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply livelock fix
        shell: pwsh
        run: python .github/scripts/apply_autopilot_livelock_fix_v2.py

      - name: Fix generated regression imports
        shell: pwsh
        run: |
          $path = 'tests/PCCExecutive.App.Tests/AutopilotLivelockRecoveryContractTests.cs'
          $body = Get-Content $path -Raw
          Set-Content -Path $path -Value ("using System;`r`nusing System.IO;`r`n" + $body) -Encoding utf8

      - name: Run focused recovery tests
        shell: pwsh
        run: dotnet test tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj -c Release

      - name: Run full deterministic solution
        shell: pwsh
        run: dotnet test PCCExecutive.sln -c Release

      - name: Commit proven livelock fix and retire applicator
        shell: pwsh
        run: |
          Remove-Item .github/workflows/autopilot-livelock-recovery.yml
          Remove-Item .github/scripts/apply_autopilot_livelock_fix.py
          Remove-Item .github/scripts/apply_autopilot_livelock_fix_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.App/Presentation/IntegratedPresentationGateway.cs tests/PCCExecutive.App.Tests/AutopilotLivelockRecoveryContractTests.cs .github/workflows/autopilot-livelock-recovery.yml .github/scripts/apply_autopilot_livelock_fix.py .github/scripts/apply_autopilot_livelock_fix_v2.py
          git commit -m "fix(runtime): break recovered Manager autopilot livelock"
          git push origin HEAD:worker/pcc-autopilot-livelock-recovery
