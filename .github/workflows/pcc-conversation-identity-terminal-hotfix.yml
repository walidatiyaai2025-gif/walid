name: PCC conversation identity terminal hotfix

on:
  push:
    branches:
      - worker/pcc-conversation-identity-terminal-fix
    paths:
      - .github/workflows/pcc-conversation-identity-terminal-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/pcc-conversation-identity-terminal-fix
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply deterministic ChatGPT conversation identity hotfix
        shell: pwsh
        run: ./.github/scripts/pcc-conversation-identity-terminal-hotfix.ps1

      - name: Run focused browser regressions
        shell: pwsh
        run: dotnet test tests/PCCExecutive.Browser.Tests/PCCExecutive.Browser.Tests.csproj -c Release

      - name: Commit hotfix and retire one-shot applicator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.Browser/PlaywrightChromeRuntimeHost.cs src/PCCExecutive.Browser/ChatGptBrowserAdapter.cs src/PCCExecutive.Browser/ChatGptPageSelectionPolicy.cs tests/PCCExecutive.Browser.Tests/ChatGptPageSelectionPolicyTests.cs
          git rm .github/workflows/pcc-conversation-identity-terminal-hotfix.yml .github/scripts/pcc-conversation-identity-terminal-hotfix.ps1
          git commit -m "fix(runtime): bind the stable ChatGPT conversation deterministically"
          git push origin HEAD:worker/pcc-conversation-identity-terminal-fix
