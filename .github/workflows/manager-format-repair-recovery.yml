name: PCC Manager structured-response recovery

on:
  push:
    branches:
      - worker/pcc-manager-format-repair-recovery

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, 'fix(manager): recover unstructured manager responses') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply bounded Manager response recovery
        shell: pwsh
        run: ./build/Apply-ManagerFormatRepairRecovery.ps1
      - name: Manager application regressions
        shell: pwsh
        run: dotnet test tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj -c Release
      - name: Manager runtime wiring regressions
        shell: pwsh
        run: dotnet test tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj -c Release
      - name: Full deterministic solution
        shell: pwsh
        run: dotnet test PCCExecutive.sln -c Release
      - name: Commit proven runtime fix and retire applicator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.App/Presentation/IntegratedPresentationGateway.cs src/PCCExecutive.Application/ManagerPlanningPromptBuilder.cs tests/PCCExecutive.Application.Tests/ManagerPlanningPromptBuilderTests.cs tests/PCCExecutive.App.Tests/ManagerFormatRepairRecoveryContractTests.cs
          git rm build/Apply-ManagerFormatRepairRecovery.ps1 .github/workflows/manager-format-repair-recovery.yml
          git commit -m "fix(manager): recover unstructured manager responses"
          git push origin HEAD:worker/pcc-manager-format-repair-recovery
