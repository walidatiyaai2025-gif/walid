name: One-shot Chrome-first recovery patch

on:
  push:
    branches:
      - worker/pcc-github-evidence-recovery
    paths:
      - tools/apply_chrome_first_recovery_patch.py
      - .github/workflows/temp-chrome-first-recovery-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/pcc-github-evidence-recovery
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 tools/apply_chrome_first_recovery_patch.py
      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git rm -f tools/apply_chrome_first_recovery_patch.py .github/workflows/temp-chrome-first-recovery-patch.yml
          git add -A
          git commit -m "fix(runtime): recover Chrome before Manager planning"
          git push origin HEAD:worker/pcc-github-evidence-recovery
