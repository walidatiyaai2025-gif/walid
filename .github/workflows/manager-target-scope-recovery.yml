name: PCC Manager target scope recovery

on:
  push:
    branches:
      - worker/pcc-autopilot-livelock-recovery
    paths:
      - .github/scripts/apply_manager_target_scope_recovery.py
      - .github/workflows/manager-target-scope-recovery.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply manager TargetScope recovery fix
        run: python .github/scripts/apply_manager_target_scope_recovery.py
      - name: Application regression tests
        run: dotnet test tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj -c Release
      - name: Full deterministic solution
        run: dotnet test PCCExecutive.sln -c Release
      - name: Commit proven fix and retire applicator
        shell: pwsh
        run: |
          git rm .github/scripts/apply_manager_target_scope_recovery.py .github/workflows/manager-target-scope-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PCCExecutive.Application/ManagerOrchestration.cs src/PCCExecutive.App/Presentation/IntegratedPresentationGateway.cs tests/PCCExecutive.Application.Tests/ManagerTargetScopeRecoveryTests.cs
          git commit -m "fix(manager): recover noncanonical target scope labels"
          git push origin HEAD:worker/pcc-autopilot-livelock-recovery
