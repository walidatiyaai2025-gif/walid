name: PCC Executive final runtime closure
# phase: full-deterministic-runtime-gate

on:
  push:
    branches:
      - worker/pcc-final-runtime-e2e-closure

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, '[runtime-closure-patch]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Normalize closure launcher idempotency
        shell: pwsh
        run: |
          $utf8 = [Text.UTF8Encoding]::new($false)
          $path = './build/Apply-FinalRuntimeClosure.ps1'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('$Path:', '${Path}:')
          $old = '$chat = $chat.Replace(''public sealed class PlaywrightChatGptBrowserAdapter : IChatGptBrowserAdapter'', ''public sealed class PlaywrightChatGptBrowserAdapter : IChatGptBrowserAdapter, IPhysicalSubmitAuthorizationAdapter'')'
          $new = 'if (-not $chat.Contains(''public sealed class PlaywrightChatGptBrowserAdapter : IChatGptBrowserAdapter, IPhysicalSubmitAuthorizationAdapter'')) {`r`n    $chat = $chat.Replace(''public sealed class PlaywrightChatGptBrowserAdapter : IChatGptBrowserAdapter'', ''public sealed class PlaywrightChatGptBrowserAdapter : IChatGptBrowserAdapter, IPhysicalSubmitAuthorizationAdapter'')`r`n}'
          if ($text.Contains($old)) { $text = $text.Replace($old, $new) }
          [IO.File]::WriteAllText($path, $text, $utf8)

          $sourcePath = './src/PCCExecutive.Browser/ChatGptBrowserAdapter.cs'
          $source = [IO.File]::ReadAllText($sourcePath)
          $duplicate = 'IChatGptBrowserAdapter, IPhysicalSubmitAuthorizationAdapter, IPhysicalSubmitAuthorizationAdapter'
          while ($source.Contains($duplicate)) {
            $source = $source.Replace($duplicate, 'IChatGptBrowserAdapter, IPhysicalSubmitAuthorizationAdapter')
          }
          [IO.File]::WriteAllText($sourcePath, $source, $utf8)

      - name: Apply production runtime closure patch
        shell: pwsh
        run: ./build/Apply-FinalRuntimeClosure.ps1

      - name: Apply final E2E compile reconciliation
        shell: pwsh
        run: ./build/Apply-FinalE2ECompileClosure.ps1

      - name: Persist intended source patch
        shell: pwsh
        run: |
          git config user.name "pcc-runtime-closure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests build .gitignore .github/workflows/final-runtime-closure.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: finalize durable runtime safety and acceptance"
            git push origin HEAD:worker/pcc-final-runtime-e2e-closure
          }

      - name: Build solution
        shell: pwsh
        run: dotnet build PCCExecutive.sln -c Release

      - name: Restore and build deterministic test projects
        shell: pwsh
        run: |
          $projects = @(
            'tests/PCCExecutive.Domain.Tests/PCCExecutive.Domain.Tests.csproj',
            'tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj',
            'tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj',
            'tests/PCCExecutive.Browser.Tests/PCCExecutive.Browser.Tests.csproj',
            'tests/PCCExecutive.Browser.Acceptance/PCCExecutive.Browser.Acceptance.csproj',
            'tests/PCCExecutive.Infrastructure.Tests/PCCExecutive.Infrastructure.Tests.csproj',
            'tests/PCCExecutive.Integration/PCCExecutive.Integration.csproj',
            'tests/PCCExecutive.E2E/PCCExecutive.E2E.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run deterministic suites
        shell: pwsh
        run: |
          $projects = @(
            'tests/PCCExecutive.Domain.Tests/PCCExecutive.Domain.Tests.csproj',
            'tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj',
            'tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj',
            'tests/PCCExecutive.Browser.Tests/PCCExecutive.Browser.Tests.csproj',
            'tests/PCCExecutive.Browser.Acceptance/PCCExecutive.Browser.Acceptance.csproj',
            'tests/PCCExecutive.Infrastructure.Tests/PCCExecutive.Infrastructure.Tests.csproj',
            'tests/PCCExecutive.Integration/PCCExecutive.Integration.csproj',
            'tests/PCCExecutive.E2E/PCCExecutive.E2E.csproj'
          )
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Assert generated outputs are not tracked
        shell: pwsh
        run: |
          $tracked = git ls-files | Select-String -Pattern '(^|/)(bin|obj)/|\.(dll|pdb)$|^build/final-runtime-closure\.last\.log$|^build/runtime-closure\.request$'
          if ($tracked) {
            $tracked | ForEach-Object { Write-Error "Tracked generated output: $_" }
            exit 1
          }
          if (Test-Path './build/Test-GeneratedOutputHygiene.ps1') {
            ./build/Test-GeneratedOutputHygiene.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
