name: PCC Executive final runtime closure
# phase: full-deterministic-runtime-gate

on:
  push:
    branches:
      - worker/pcc-final-runtime-e2e-closure

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, '[runtime-closure-patch]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Normalize closure launcher interpolation
        shell: pwsh
        run: |
          $path = './build/Apply-FinalRuntimeClosure.ps1'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('$Path:', '${Path}:')
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Apply production runtime closure patch
        shell: pwsh
        run: ./build/Apply-FinalRuntimeClosure.ps1

      - name: Persist intended source patch
        shell: pwsh
        run: |
          git config user.name "pcc-runtime-closure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests build .gitignore .github/workflows/final-runtime-closure.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: finalize durable runtime safety and acceptance"
            git push origin HEAD:worker/pcc-final-runtime-e2e-closure
          }

      - name: Build solution
        shell: pwsh
        run: dotnet build PCCExecutive.sln -c Release

      - name: Restore and build deterministic test projects
        shell: pwsh
        run: |
          $projects = @(
            'tests/PCCExecutive.Domain.Tests/PCCExecutive.Domain.Tests.csproj',
            'tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj',
            'tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj',
            'tests/PCCExecutive.Browser.Tests/PCCExecutive.Browser.Tests.csproj',
            'tests/PCCExecutive.Browser.Acceptance/PCCExecutive.Browser.Acceptance.csproj',
            'tests/PCCExecutive.Infrastructure.Tests/PCCExecutive.Infrastructure.Tests.csproj',
            'tests/PCCExecutive.Integration/PCCExecutive.Integration.csproj',
            'tests/PCCExecutive.E2E/PCCExecutive.E2E.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run deterministic suites
        shell: pwsh
        run: |
          $projects = @(
            'tests/PCCExecutive.Domain.Tests/PCCExecutive.Domain.Tests.csproj',
            'tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj',
            'tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj',
            'tests/PCCExecutive.Browser.Tests/PCCExecutive.Browser.Tests.csproj',
            'tests/PCCExecutive.Browser.Acceptance/PCCExecutive.Browser.Acceptance.csproj',
            'tests/PCCExecutive.Infrastructure.Tests/PCCExecutive.Infrastructure.Tests.csproj',
            'tests/PCCExecutive.Integration/PCCExecutive.Integration.csproj',
            'tests/PCCExecutive.E2E/PCCExecutive.E2E.csproj'
          )
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Assert generated outputs are not tracked
        shell: pwsh
        run: |
          $tracked = git ls-files | Select-String -Pattern '(^|/)(bin|obj)/|\.(dll|pdb)$|^build/final-runtime-closure\.last\.log$|^build/runtime-closure\.request$'
          if ($tracked) {
            $tracked | ForEach-Object { Write-Error "Tracked generated output: $_" }
            exit 1
          }
          if (Test-Path './build/Test-GeneratedOutputHygiene.ps1') {
            ./build/Test-GeneratedOutputHygiene.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
