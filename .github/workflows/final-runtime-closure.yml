name: PCC Executive final runtime closure

on:
  push:
    branches:
      - worker/pcc-final-runtime-e2e-closure

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, '[runtime-closure-patch]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply final runtime closure patch
        shell: pwsh
        run: ./build/Apply-FinalRuntimeClosure.ps1

      - name: Build and deterministic suites
        id: verify
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:GITHUB_WORKSPACE 'build/final-runtime-closure.last.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $commands = @(
            'dotnet build PCCExecutive.sln -c Release',
            'dotnet test tests/PCCExecutive.Domain.Tests/PCCExecutive.Domain.Tests.csproj -c Release --no-build',
            'dotnet test tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj -c Release --no-build',
            'dotnet test tests/PCCExecutive.App.Tests/PCCExecutive.App.Tests.csproj -c Release --no-build',
            'dotnet test tests/PCCExecutive.Browser.Tests/PCCExecutive.Browser.Tests.csproj -c Release --no-build',
            'dotnet test tests/PCCExecutive.Browser.Acceptance/PCCExecutive.Browser.Acceptance.csproj -c Release --no-build',
            'dotnet test tests/PCCExecutive.Infrastructure.Tests/PCCExecutive.Infrastructure.Tests.csproj -c Release --no-build'
          )
          $failed = $false
          foreach ($command in $commands) {
            "`n===== $command =====" | Tee-Object -FilePath $log -Append
            Invoke-Expression "$command 2>&1" | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true; break }
          }
          if ($failed) { "RESULT=FAIL" | Tee-Object -FilePath $log -Append; exit 1 }
          "RESULT=PASS" | Tee-Object -FilePath $log -Append

      - name: Persist source patch and verification transcript
        if: always()
        shell: pwsh
        run: |
          git config user.name "pcc-runtime-closure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests build/final-runtime-closure.last.log
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close autonomous runtime send safety"
            git push origin HEAD:worker/pcc-final-runtime-e2e-closure
          }

      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        shell: pwsh
        run: exit 1
