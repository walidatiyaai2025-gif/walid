name: PCC manager response resume recovery

on:
  push:
    branches:
      - worker/pcc-manager-plan-schema-recovery

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply manager response resume recovery
        shell: pwsh
        run: python build/Apply-ManagerResponseResumeRecovery.py
      - name: Run focused restart and manager tests
        shell: pwsh
        run: dotnet test tests/PCCExecutive.Application.Tests/PCCExecutive.Application.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~LoopGuardRestartAcceptanceTests|FullyQualifiedName~ManagerOrchestrationTests"
      - name: Run full deterministic test solution
        shell: pwsh
        run: dotnet test PCCExecutive.sln -c Release --nologo
      - name: Commit proven recovery and retire applicator
        shell: pwsh
        run: |
          Remove-Item build/Apply-ManagerResponseResumeRecovery.py
          Remove-Item .github/workflows/manager-response-resume-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(manager): reparse received response after schema stall"
          git push
